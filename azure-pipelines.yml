trigger:
- main

variables:
  buildConfiguration: 'Release'
  # Yahan apni details dalein:
  azureConnectionName: 'MyAzureDeploy'
  webAppName: 'cleanarchitecture-api-anees' # Jo nayi dukan abhi portal par banayi thi

stages:
# ================================
# STAGE 1: FACTORY (BUILD & PACK)
# ================================
- stage: Build
  displayName: 'Build API'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Force Install .NET SDK 10'
      inputs:
        packageType: 'sdk'
        version: '10.0.201'
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      displayName: 'Build the project'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) -p:NuGetAudit=false -p:TreatWarningsAsErrors=false'

    - task: DotNetCoreCLI@2
      displayName: 'Publish & Zip the API'
      inputs:
        command: 'publish'
        publishWebProjects: true 
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) -p:NuGetAudit=false -p:TreatWarningsAsErrors=false'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Save the Package (Artifact)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

# ================================
# STAGE 2: TRUCK (DEPLOY TO AZURE)
# ================================
- stage: Deploy
  displayName: 'Deploy API'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    environment: 'Production'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          # Note: Deployment jobs automatically download the artifact to $(Pipeline.Workspace)
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Azure App Service'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(azureConnectionName)'
              appType: 'webApp'
              WebAppName: '$(webAppName)'
              packageForLinux: '$(Pipeline.Workspace)/drop/**/*.zip'